begin SENSOR_GLOBAL
    external_platform_library_path = libsensor_platform_broadcom_rpi5.so
    external_platform_library_variant = PLATFORM_VARIANT_BCM2712
end SENSOR_GLOBAL

# Simulator camera i.e. color bars
begin SENSOR_UNIT_1
    type = simulator_camera
    name = front
    position = 0, 0, 0
    direction = 0, 0, 0
    default_video_resolution = 1280, 720
    default_video_format = ycbycr
    num_user_buffers = 4
end SENSOR_UNIT_1

# Video playback of simulator camera i.e. color bars
begin SENSOR_UNIT_2
    type = file_camera
    address = /data/share/sensor/simulator_camera.mov
end SENSOR_UNIT_2

# Camera Module 3 (camera 1)
begin SENSOR_UNIT_3
    type = external_camera
    name = imx708
    address = /usr/lib/libimx708_external_camera.so,1
    use_hardware_capture = true
    i2c_path = /dev/i2c6
    default_video_format = nv12
    default_video_resolution = 2304, 1296
    default_video_framerate = 30
    algorithm_config = /etc/config/sensor/rpi5/rpi5_algorithm_imx708.json, imx708
end SENSOR_UNIT_3

# Camera Module 3 (camera 2)
begin SENSOR_UNIT_4
    type = external_camera
    name = imx708
    address = /usr/lib/libimx708_external_camera.so,1
    use_hardware_capture = true
    i2c_path = /dev/i2c4
    default_video_format = nv12
    default_video_resolution = 2304, 1296
    default_video_framerate = 30
    algorithm_config = /etc/config/sensor/rpi5/rpi5_algorithm_imx708.json, imx708
end SENSOR_UNIT_4

begin INTERIM_DATA_UNIT_1
    num_buffers = 5
    buffer_size = 8096
    queue_depth = 1
    data_format = SENSOR_FORMAT_ISP_TUNING_REQUEST
    name = tuning_requests
end INTERIM_DATA_UNIT_1

begin INTERIM_DATA_UNIT_2
    num_buffers = 5
    buffer_size = 8096
    queue_depth = 1
    data_format = SENSOR_FORMAT_ISP_TUNING_REQUEST
    name = tuning_requests
end INTERIM_DATA_UNIT_2

begin ISP_TUNING_1
    request_interim_data_unit = INTERIM_DATA_UNIT_1
    sensor_units = SENSOR_UNIT_3
end ISP_TUNING_1

begin ISP_TUNING_2
    request_interim_data_unit = INTERIM_DATA_UNIT_2
    sensor_units = SENSOR_UNIT_4
end ISP_TUNING_2

# USB camera
begin SENSOR_UNIT_5
    type = usb_camera
    name = front-camera
    position = 0, 0, 0
    direction = 0, 0, 0
    default_video_framerate = 30
    address = /dev/usb/io-usb-otg, -1, -1, -1, -1
end SENSOR_UNIT_5

